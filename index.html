<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>戀與深空 專屬記帳系統</title>
  <style>
    /* 預設主題：夢幻淡紫 */
    :root {
      --bg-color: #f8f5fc;
      --card-bg: #ffffff;
      --primary-color: #9d8ec7;
      --primary-light: #f0ebf8;
      --primary-dark: #705b9e;
      --accent-pink: #f3d5df;
      --accent-gold: #d8b368;
      --text-main: #433952;
      --text-sub: #877b99;
      --border-color: #e6e0f0;
      --danger-color: #e57373;
      --danger-light: #fbe9e7;
      --success-color: #66bb6a;
      --success-light: #e8f5e9;
      --gradient-start: #a392cc;
      --gradient-end: #c4b5e2;
    }

    /* 櫻花粉 */
    [data-theme="pink"] {
      --bg-color: #faf4f6;
      --card-bg: #ffffff;
      --primary-color: #e5829d;
      --primary-light: #fbe8ee;
      --primary-dark: #b84c6c;
      --text-main: #5a4048;
      --text-sub: #9e828a;
      --border-color: #f0e1e6;
      --gradient-start: #e5829d;
      --gradient-end: #f0a3b8;
    }

    /* 淺草綠色 */
    [data-theme="green"] {
      --bg-color: #f4fbf5;
      --card-bg: #ffffff;
      --primary-color: #7bc67e;
      --primary-light: #edf7ed;
      --primary-dark: #3b8740;
      --text-main: #2b3a2c;
      --text-sub: #719b73;
      --border-color: #d8eed9;
      --gradient-start: #7bc67e;
      --gradient-end: #a3e0a6;
    }

    /* 向日葵黃 */
    [data-theme="yellow"] {
      --bg-color: #fbf8f0;
      --card-bg: #ffffff;
      --primary-color: #d99b26;
      --primary-light: #fbf0d9;
      --primary-dark: #9c6c13;
      --text-main: #54462e;
      --text-sub: #94856a;
      --border-color: #f0e6d2;
      --gradient-start: #e0a32e;
      --gradient-end: #ebb852;
    }

    /* 天空藍 */
    [data-theme="blue"] {
      --bg-color: #f0f6fa;
      --card-bg: #ffffff;
      --primary-color: #5b9bd5;
      --primary-light: #e3f0f9;
      --primary-dark: #376ea0;
      --text-main: #3b4d5e;
      --text-sub: #7b8e9e;
      --border-color: #d8e5f0;
      --gradient-start: #5b9bd5;
      --gradient-end: #82b6e5;
    }

    /* 星空黑 (質感深藍夜空) */
    [data-theme="dark"] {
      --bg-color: #12131a;
      --card-bg: #1e202c;
      --primary-color: #b59beb;
      --primary-light: #2d2b3d;
      --primary-dark: #d5c4f7;
      --text-main: #e8e6f0;
      --text-sub: #9da0b5;
      --border-color: #2e3144;
      --gradient-start: #322b48;
      --gradient-end: #514275;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .app-container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      transition: max-width 0.3s ease;
    }

    @media (min-width: 992px) {
      .app-container {
        max-width: 900px;
      }
      .desktop-two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        align-items: start;
      }
      .items-grid {
        grid-template-columns: repeat(2, 1fr) !important;
      }
    }

    header {
      position: relative;
      text-align: center;
      padding: 12px 0 16px;
    }

    .user-profile {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      cursor: pointer;
    }
    .user-avatar { font-size: 1.1rem; }
    .user-name {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary-dark);
      max-width: 90px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-selector {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .theme-selector label {
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 600;
    }
    .theme-select {
      background: transparent;
      border: none;
      font-size: 0.8rem;
      color: var(--primary-dark);
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    header h1 {
      font-size: 1.5rem;
      color: var(--primary-dark);
      letter-spacing: 1px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 36px;
    }
    @media (min-width: 480px) {
      header h1 { margin-top: 0; }
    }
    header p {
      font-size: 0.88rem;
      color: var(--text-sub);
    }

    /* 雲端備份與匯入工具列 */
    .cloud-tools {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .cloud-status {
      font-size: 0.8rem;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cloud-actions {
      display: flex;
      gap: 6px;
    }
    .btn-cloud {
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .total-card {
      background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%);
      color: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .total-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .total-title { font-size: 0.95rem; opacity: 0.95; }
    .btn-clear-all {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .total-amount-display {
      font-size: 2.4rem;
      font-weight: 700;
    }

    .section-title {
      font-size: 1rem;
      color: var(--primary-dark);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .section-title::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 14px;
      background-color: var(--primary-color);
      border-radius: 2px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }
    @media (max-width: 400px) {
      .items-grid { grid-template-columns: 1fr; }
    }
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .item-card.full-width { grid-column: 1 / -1; }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .item-name { font-size: 0.9rem; font-weight: 600; }
    .item-price-tag {
      font-size: 0.75rem;
      color: var(--primary-color);
      background: var(--primary-light);
      padding: 2px 6px;
      border-radius: 6px;
    }
    .item-inputs {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .input-field {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.85rem;
      background: var(--bg-color);
      color: var(--text-main);
      outline: none;
    }
    textarea.input-field {
      height: 64px;
      resize: vertical;
      min-height: 48px;
    }
    .btn-add {
      background-color: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 階層式統計與歷史紀錄卡片 */
    .hierarchical-card, .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .tree-list, .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-list { max-height: 350px; overflow-y: auto; }
    
    .tree-node {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
    }
    .tree-node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: var(--bg-color);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
    }
    .tree-node-title { display: flex; align-items: center; gap: 8px; }
    .tree-toggle-icon { font-size: 0.75rem; color: var(--primary-color); transition: transform 0.2s ease; }
    .tree-node.open .tree-toggle-icon { transform: rotate(90deg); }
    .tree-children {
      display: none;
      padding: 8px 12px 10px 28px;
      border-top: 1px dashed var(--border-color);
    }
    .tree-node.open .tree-children { display: block; }
    .tree-child-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.83rem;
      border-bottom: 1px dotted var(--border-color);
    }

    .history-empty { text-align: center; color: var(--text-sub); font-size: 0.85rem; padding: 20px 0; }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-color);
      border-radius: 10px;
      border-left: 3px solid var(--primary-color);
    }
    .history-info { display: flex; flex-direction: column; gap: 2px; max-width: 70%; }
    .history-title { font-size: 0.88rem; font-weight: 600; }
    .history-note { font-size: 0.78rem; color: var(--text-sub); }
    .history-right { display: flex; align-items: center; gap: 10px; }
    .history-amount { font-size: 0.95rem; font-weight: 700; color: var(--primary-dark); }
    .btn-delete-single {
      background: var(--danger-light);
      color: var(--danger-color);
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: var(--card-bg); border-radius: 18px; padding: 24px;
      width: 88%; max-width: 380px; text-align: center;
      border: 1px solid var(--border-color);
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; }
    .modal-msg { font-size: 0.88rem; color: var(--text-main); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; justify-content: center; }
    .btn-modal { flex: 1; padding: 10px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; border: none; cursor: pointer; }
    .btn-modal-cancel { background: var(--bg-color); color: var(--text-sub); border: 1px solid var(--border-color); }
    .btn-modal-confirm { background: var(--primary-color); color: #fff; }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: var(--primary-dark); color: #fff;
      padding: 12px 22px; border-radius: 25px; font-size: 0.88rem;
      opacity: 0; transition: all 0.3s ease; z-index: 10000;
      pointer-events: none; text-align: center; max-width: 85vw;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="user-profile" onclick="editProfile()">
        <span class="user-avatar" id="avatar-display">🌸</span>
        <span class="user-name" id="username-display">獵人小姐</span>
      </div>

      <div class="theme-selector">
        <label for="theme-select">🎨 配色:</label>
        <select id="theme-select" class="theme-select" onchange="changeTheme(this.value)">
          <option value="default">淡雅紫</option>
          <option value="pink">櫻花粉</option>
          <option value="green">淺草綠</option>
          <option value="yellow">向日葵黃</option>
          <option value="blue">天空藍</option>
          <option value="dark">星空黑</option>
        </select>
      </div>

      <h1>✨ 戀與深空專屬記帳 ✨</h1>
      <p>輕鬆記錄每一筆深空投入</p>
    </header>

    <!-- 備份與匯入檔案工具列 -->
    <div class="cloud-tools">
      <div class="cloud-status">
        <span id="cloud-status-text">💾 本地儲存備份</span>
      </div>
      <div class="cloud-actions">
        <button type="button" class="btn-cloud" onclick="exportToFile()">☁️ 備份至雲端</button>
        <button type="button" class="btn-cloud" onclick="importFromFile()">📥 從雲端載入</button>
      </div>
    </div>
    
    <!-- 隱藏的檔案上傳輸入框 -->
    <input type="file" id="file-input" accept=".json" style="display: none;" onchange="handleFileSelect(event)">

    <div class="total-card">
      <div class="total-header">
        <span class="total-title">累積總支出</span>
        <button type="button" class="btn-clear-all" onclick="confirmClearAll()">一鍵清空</button>
      </div>
      <div class="total-amount-display" id="total-amount">$0</div>
    </div>

    <div class="desktop-two-col">
      <div>
        <div class="section-title">新增消費紀錄</div>
        <div class="items-grid">
          <div class="item-card">
            <div class="item-header"><span class="item-name">月卡</span><span class="item-price-tag">$150</span></div>
            <div class="item-inputs">
              <input type="number" id="input-monthly" class="input-field" placeholder="數量" min="1" value="1">
              <button type="button" class="btn-add" onclick="addItem('月卡', 150, 'input-monthly')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">週卡</span><span class="item-price-tag">自訂</span></div>
            <div class="item-inputs">
              <input type="number" id="input-weekly" class="input-field" placeholder="金額" min="1">
              <button type="button" class="btn-add" onclick="addCustomItem('週卡', 'input-weekly')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">320元密約</span><span class="item-price-tag">$320</span></div>
            <div class="item-inputs">
              <input type="number" id="input-pledge320" class="input-field" placeholder="數量" min="1" value="1">
              <button type="button" class="btn-add" onclick="addItem('320元密約', 320, 'input-pledge320')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">490元密約</span><span class="item-price-tag">$490</span></div>
            <div class="item-inputs">
              <input type="number" id="input-pledge490" class="input-field" placeholder="數量" min="1" value="1">
              <button type="button" class="btn-add" onclick="addItem('490元密約', 490, 'input-pledge490')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">15元禮包</span><span class="item-price-tag">$15</span></div>
            <div class="item-inputs">
              <input type="number" id="input-pack15" class="input-field" placeholder="數量" min="1" value="1">
              <button type="button" class="btn-add" onclick="addItem('15元禮包', 15, 'input-pack15')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">30元禮包</span><span class="item-price-tag">$30</span></div>
            <div class="item-inputs">
              <input type="number" id="input-pack30" class="input-field" placeholder="數量" min="1" value="1">
              <button type="button" class="btn-add" onclick="addItem('30元禮包', 30, 'input-pack30')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">150元禮包</span><span class="item-price-tag">$150</span></div>
            <div class="item-inputs">
              <input type="number" id="input-pack150" class="input-field" placeholder="數量" min="1" value="1">
              <button type="button" class="btn-add" onclick="addItem('150元禮包', 150, 'input-pack150')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">禮包</span><span class="item-price-tag">自訂</span></div>
            <div class="item-inputs">
              <input type="number" id="input-general-pack" class="input-field" placeholder="金額" min="1">
              <button type="button" class="btn-add" onclick="addCustomItem('禮包', 'input-general-pack')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">150元活動密約</span><span class="item-price-tag">$150</span></div>
            <div class="item-inputs">
              <input type="number" id="input-event150" class="input-field" placeholder="數量" min="1" value="1">
              <button type="button" class="btn-add" onclick="addItem('150元活動密約', 150, 'input-event150')">加入</button>
            </div>
          </div>
          <div class="item-card">
            <div class="item-header"><span class="item-name">鑽石</span><span class="item-price-tag">自訂</span></div>
            <div class="item-inputs">
              <input type="number" id="input-diamond" class="input-field" placeholder="金額" min="1">
              <button type="button" class="btn-add" onclick="addCustomItem('鑽石', 'input-diamond')">加入</button>
            </div>
          </div>
          <div class="item-card full-width">
            <div class="item-header">
              <span class="item-name">其他</span>
              <span class="item-price-tag">自訂金額與大容量備註</span>
            </div>
            <div class="item-inputs" style="flex-direction: column; gap: 8px;">
              <div style="display: flex; gap: 8px; width: 100%; align-items: flex-start;">
                <input type="number" id="input-other-price" class="input-field" placeholder="金額" min="1" style="width: 110px;">
                <textarea id="input-other-note" class="input-field" placeholder="備註內容..." style="flex: 1;"></textarea>
                <button type="button" class="btn-add" onclick="addOtherItem()" style="height: 64px;">加入</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <!-- 階層式統計明細區塊 -->
        <div class="section-title">階層式統計明細 (點擊可展開)</div>
        <div class="hierarchical-card">
          <div class="tree-list" id="tree-container"></div>
        </div>

        <div class="section-title">消費歷史紀錄</div>
        <div class="history-card">
          <div class="history-list" id="history-container">
            <div class="history-empty">尚無消費紀錄</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="custom-modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">提示</div>
      <div class="modal-msg" id="modal-msg">內容訊息</div>
      <div class="modal-actions">
        <button type="button" class="btn-modal btn-modal-cancel" onclick="closeModal()">取消</button>
        <button type="button" class="btn-modal btn-modal-confirm" id="modal-confirm-btn">確定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const categories = [
      '月卡', '週卡', '320元密約', '490元密約', '15元禮包', 
      '30元禮包', '150元禮包', '禮包', '150元活動密約', '鑽石', '其他'
    ];

    // 22 則幽默吐槽金句（已包含夏以晝與其他男主）
    const roastQuotes = [
      "你怎麼又儲值了！？魔法卡再刷要刷爆啦！💳",
      "記得好好吃飯捏！別只顧著給男主買禮物！🍚",
      "男主們確實感受到你滿滿的誠意（與魔法卡）了！✨",
      "手起刀落又是一筆！你的錢包正在哭泣！💸",
      "這次又是為了哪一位男主課金呢？😏",
      "再這樣課下去，下半個月只能吃泡麵了喔！🍜",
      "沒關係，錢沒有不見，只是變成喜歡的樣子陪在身邊！💖",
      "課金一時爽，一直課金一直爽！🤪",
      "冷靜！請想想你的存款餘額！小小的錢包受不了啦！👛",
      "愛他就要給他最好的，這筆錢花得值了！（大概吧？🤣）",
      "警報！您的錢包厚度正在急速下降中！🚨",
      "深空獵人小姐，請保持理性消費...算了你肯定停不下來！😂",
      "沈星回：『你又給我和其他人花錢了嗎？早點休息吧。』💤",
      "黎深：『這筆開銷...需要我幫你開一張冷靜心智的處方嗎？』🩺",
      "祁煜：『哼，算你識相！不過你的畫布/錢包好像快破洞了？』🎨",
      "秦徹：『這點數額也值得你猶豫？拿去，繼續刷。』🍷",
      "夏以晝：『妹，課金要適量啊！要是沒錢吃飯了，哥隨時都在，帶你去吃大餐！』🍳",
      "下半個月的菜單：觀音土佐白開水，主廚就是你自己！🍽️",
      "抽卡手氣有變好嗎？沒有的話這筆錢就虧大啦！🎲",
      "你的魔法卡已經發燙到可以拿來烤肉了！🔥",
      "男主：『謝謝你的愛，但你的銀行帳戶還好嗎？』🥹",
      "按『加入』的手速度快到連流星都追不上！打折也沒這麼快！⚡"
    ];

    let lastRoastIndex = -1;
    function getRandomRoast() {
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * roastQuotes.length);
      } while (randomIndex === lastRoastIndex && roastQuotes.length > 1);
      lastRoastIndex = randomIndex;
      return roastQuotes[randomIndex];
    }

    // 讀取本地資料
    let records = JSON.parse(localStorage.getItem('deepspace_records') || "[]");

    function saveLocal() {
      localStorage.setItem('deepspace_records', JSON.stringify(records));
      updateUI();
    }

    // 匯出 JSON 文件檔 (下載到本地/雲端硬碟)
    function exportToFile() {
      if (records.length === 0) {
        showToast("目前沒有任何紀錄可以匯出喔！");
        return;
      }
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(records, null, 2));
      const downloadAnchor = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `戀與深空記帳備份_${dateStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("已成功下載備份文件檔！");
    }

    // 觸發選擇 JSON 檔案
    function importFromFile() {
      document.getElementById('file-input').click();
    }

    // 處理選擇的文件檔案
    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            showConfirmModal(
              '📥 載入備份檔',
              '這將會覆蓋目前的記帳紀錄，確定要載入嗎？',
              function() {
                records = importedData;
                saveLocal();
                showToast("已成功匯入備份資料！");
              }
            );
          } else {
            showToast("檔案格式不正確，請確認是有效的備份檔！");
          }
        } catch (err) {
          showToast("解析檔案失敗，請選擇正確的 JSON 備份檔！");
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // 重置 input 讓重複選擇同個檔案也能觸發
    }

    function loadProfile() {
      const avatar = localStorage.getItem('deepspace_avatar') || '🌸';
      const name = localStorage.getItem('deepspace_username') || '獵人小姐';
      document.getElementById('avatar-display').innerText = avatar;
      document.getElementById('username-display').innerText = name;
    }

    function editProfile() {
      const currentName = document.getElementById('username-display').innerText;
      const currentAvatar = document.getElementById('avatar-display').innerText;
      const newName = prompt('請輸入您的暱稱：', currentName);
      if (newName !== null && newName.trim() !== '') {
        const newAvatar = prompt('請輸入頭像 Emoji:', currentAvatar);
        localStorage.setItem('deepspace_username', newName.trim());
        if (newAvatar !== null && newAvatar.trim() !== '') {
          localStorage.setItem('deepspace_avatar', newAvatar.trim());
        }
        loadProfile();
        showToast("個人資料更新成功！");
      }
    }

    function changeTheme(themeName) {
      if (themeName === 'default') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', themeName);
      }
      localStorage.setItem('deepspace_theme', themeName);
    }

    const savedTheme = localStorage.getItem('deepspace_theme') || 'default';
    document.getElementById('theme-select').value = savedTheme;
    changeTheme(savedTheme);
    loadProfile();

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function showConfirmModal(title, msg, onConfirm) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-msg').innerText = msg;
      const confirmBtn = document.getElementById('modal-confirm-btn');
      confirmBtn.onclick = function() {
        onConfirm();
        closeModal();
      };
      document.getElementById('custom-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.remove('active');
    }

    function updateUI() {
      // 計算總金額
      const grandTotal = records.reduce((sum, item) => sum + item.amount, 0);
      document.getElementById('total-amount').innerText = `$${grandTotal.toLocaleString()}`;

      // 渲染階層式統計明細 (Tree List)
      const treeContainer = document.getElementById('tree-container');
      treeContainer.innerHTML = '';

      categories.forEach(cat => {
        const catRecords = records.filter(r => r.category === cat);
        const catTotal = catRecords.reduce((sum, r) => sum + r.amount, 0);

        const treeNode = document.createElement('div');
        treeNode.className = 'tree-node';

        let childrenHTML = '';
        if (catRecords.length === 0) {
          childrenHTML = `<div class="tree-child-item"><span style="color: var(--text-sub);">無購買紀錄</span></div>`;
        } else {
          catRecords.forEach(r => {
            let noteStr = r.note ? ` - ${r.note}` : '';
            childrenHTML += `
              <div class="tree-child-item">
                <span>${r.date}${noteStr}</span>
                <span style="font-weight:600; color:var(--primary-dark);">$${r.amount.toLocaleString()}</span>
              </div>
            `;
          });
        }

        treeNode.innerHTML = `
          <div class="tree-node-header" onclick="toggleTreeNode(this.parentElement)">
            <div class="tree-node-title">
              <span class="tree-toggle-icon">▶</span>
              <span>${cat} (${catRecords.length}筆)</span>
            </div>
            <span style="font-weight:700; color:var(--primary-dark);">$${catTotal.toLocaleString()}</span>
          </div>
          <div class="tree-children">${childrenHTML}</div>
        `;
        treeContainer.appendChild(treeNode);
      });

      // 渲染歷史紀錄清單
      const historyContainer = document.getElementById('history-container');
      historyContainer.innerHTML = '';

      if (records.length === 0) {
        historyContainer.innerHTML = '<div class="history-empty">尚無消費紀錄</div>';
      } else {
        records.slice().reverse().forEach((rec) => {
          const item = document.createElement('div');
          item.className = 'history-item';
          let noteText = rec.note ? `<br><span style="color:var(--primary-dark); font-weight:500;">備註: ${rec.note}</span>` : '';

          item.innerHTML = `
            <div class="history-info">
              <span class="history-title">${rec.category}</span>
              <span class="history-note">${rec.date}${noteText}</span>
            </div>
            <div class="history-right">
              <span class="history-amount">+$${rec.amount.toLocaleString()}</span>
              <button type="button" class="btn-delete-single" onclick="deleteRecord('${rec.id}')">取消</button>
            </div>
          `;
          historyContainer.appendChild(item);
        });
      }
    }

    function toggleTreeNode(nodeElement) {
      nodeElement.classList.toggle('open');
    }

    function addItem(name, unitPrice, inputId) {
      const input = document.getElementById(inputId);
      const qty = parseInt(input.value) || 1;
      if (qty <= 0) return;

      const record = {
        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
        category: name,
        amount: unitPrice * qty,
        note: qty > 1 ? `數量 x${qty}` : '',
        date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      };
      records.push(record);
      saveLocal();
      input.value = "1";
      showToast(getRandomRoast());
    }

    function addCustomItem(name, inputId) {
      const input = document.getElementById(inputId);
      const amount = parseInt(input.value);
      if (!amount || amount <= 0) {
        showToast("請輸入正確的金額！");
        return;
      }
      const record = {
        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
        category: name,
        amount: amount,
        note: '',
        date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      };
      records.push(record);
      saveLocal();
      input.value = "";
      showToast(getRandomRoast());
    }

    function addOtherItem() {
      const priceInput = document.getElementById('input-other-price');
      const noteInput = document.getElementById('input-other-note');
      const amount = parseInt(priceInput.value);
      const note = noteInput.value.trim();

      if (!amount || amount <= 0) {
        showToast("請輸入正確的金額！");
        return;
      }
      const record = {
        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
        category: '其他',
        amount: amount,
        note: note,
        date: new Date().toLocaleDateString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      };
      records.push(record);
      saveLocal();
      priceInput.value = "";
      noteInput.value = "";
      showToast(getRandomRoast());
    }

    function deleteRecord(id) {
      records = records.filter(r => r.id !== id);
      saveLocal();
      showToast("已取消該筆紀錄");
    }

    function confirmClearAll() {
      showConfirmModal(
        '⚠️ 清空確認',
        '確定要清空所有記帳紀錄嗎？此操作無法復原！',
        function() {
          records = [];
          saveLocal();
          showToast('已清空所有歷史紀錄');
        }
      );
    }

    // 初始化畫面
    updateUI();
  </script>
</body>
</html>
